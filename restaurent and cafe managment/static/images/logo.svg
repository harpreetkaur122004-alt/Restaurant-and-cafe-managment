<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22" />
      <stop offset="100%" stop-color="#b03a2e" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2c17" />
      <stop offset="100%" stop-color="#2c1810" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="46" fill="#fffaf4" stroke="#d4a373" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Steam Waves -->
  <path d="M 40 28 Q 44 20 40 14" stroke="#e67e22" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 50 25 Q 54 17 50 11" stroke="#b03a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 60 28 Q 64 20 60 14" stroke="#e67e22" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Coffee Cup Body -->
  <path d="M 30 35 L 70 35 C 70 55 64 68 50 68 C 36 68 30 55 30 35 Z" fill="url(#cupGrad)"/>
  
  <!-- Cup Handle -->
  <path d="M 68 40 C 78 40 78 54 66 56" fill="none" stroke="url(#cupGrad)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Cup Saucer -->
  <ellipse cx="50" cy="74" rx="28" ry="4" fill="#d4a373"/>
  <ellipse cx="50" cy="73" rx="24" ry="2.5" fill="#faedcd"/>
  
  <!-- Golden Spoon / Fork Accent -->
  <circle cx="50" cy="48" r="4" fill="#e67e22"/>
  <path d="M 46 54 L 54 54" stroke="#fefae0" stroke-width="1.5" stroke-linecap="round"/>
</svg>

